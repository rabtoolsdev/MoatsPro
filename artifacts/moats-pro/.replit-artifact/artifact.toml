kind = "web"
previewPath = "/"
title = "Moats Pro"
version = "1.0.0"
id = "artifacts/moats-pro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25087

[services.development]
run = "pnpm --filter @workspace/moats-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moats-pro", "run", "build" ]
publicDir = "artifacts/moats-pro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25087"
BASE_PATH = "/"
