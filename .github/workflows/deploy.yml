name: Deploy to Hetzner (manual)

# Manual-only. Auto-push deploy was removed — user deploys by SSHing
# into 128.140.98.252 and running `sudo -u moats bash deploy/deploy.sh`.
# Kept here so it can still be triggered from the Actions tab if desired,
# but only when the HETZNER_HOST/USER/SSH_KEY repo secrets are set.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: SSH into Hetzner and run deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/moats-pro
            bash deploy/deploy.sh
